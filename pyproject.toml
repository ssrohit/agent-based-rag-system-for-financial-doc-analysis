[project]
name = "agent-based-rag-system-for-financial-doc-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.123.5",
    "langchain[google-genai]>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.0.0",
    "ruff>=0.14.7",
    "sec-edgar-downloader>=5.0.3",
    "chromadb>=1.3.7",
    "pypdf>=6.6.2",
    "langchain-chroma>=1.1.0",
    "pydantic>=2.12.5",
    "langfuse>=3.12.1",
    "bs4>=0.0.2",
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=5.6.0",
    "rank-bm25>=0.2.2",
    "langgraph>=1.0.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
